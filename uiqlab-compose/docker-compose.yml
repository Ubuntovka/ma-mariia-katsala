version: "3.9"

services:
  evaluator1:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: evaluator1
    shm_size: '2gb'
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=evaluator_db
      - DB_USER=evaluator
      - DB_PASSWORD=evaluator
    volumes:
      - ./storage:/app/storage
      - ./backend/src:/app/backend/src
    networks:
      - waex-network

  evaluator2:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: evaluator2
    shm_size: '2gb'
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=evaluator_db
      - DB_USER=evaluator
      - DB_PASSWORD=evaluator
    volumes:
      - ./storage:/app/storage
      - ./backend/src:/app/backend/src
    networks:
      - waex-network

  management:
    build: 
      context: ./backend_management
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: management
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=evaluator_db
      - DB_USER=evaluator
      - DB_PASSWORD=evaluator
    volumes:
      - ./storage:/app/storage
      - ./backend/src:/app/backend/src
    networks:
      - waex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173" 
    command: ["pnpm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    depends_on:
      - evaluator1
      - evaluator2
      - postgres
    networks:
      - waex-network
  #evaluator_postgres
  postgres:
    image: postgres:15
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_USER: evaluator
      POSTGRES_PASSWORD: evaluator
      POSTGRES_DB: evaluator_db
#    ports:
#      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluator -d evaluator_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - waex-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/frontend
    depends_on:
      - evaluator1
      - evaluator2
      - management
    networks:
      - waex-network
      - thesis-network
#  nginx:
#    image: nginx:stable-alpine
#    container_name: nginx
#    ports:
#      - "80:80"
#    volumes:
#      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#      - ./frontend/dist:/var/www/frontend
#    depends_on:
#      - evaluator1
#      - evaluator2
#      - management
#    networks:
#      - waex-network


networks:
  waex-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

  thesis-network:
    external: true
    name: thesis-network
#networks:
#  waex-network:
#    driver: bridge
#    ipam:
#      config:
#        - subnet: 172.28.0.0/16
#          gateway: 172.28.0.1

volumes:
  postgres_data:
    driver: local