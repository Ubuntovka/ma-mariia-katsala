services:
  uitend-orchestrator:
    build:
      context: ./apps/uitend-orchestrator
      dockerfile: Dockerfile
    container_name: uitend-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8181}:8181"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - BACKEND_ARTIFACT_URL=${BACKEND_ARTIFACT_URL:-http://host.docker.internal:8001}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=uitend-orchestrator-postgres
      - UITEND_RESULT_READ_TIMEOUT_SECONDS=${UITEND_RESULT_READ_TIMEOUT_SECONDS:-300}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_CONNECT_TIMEOUT_SECONDS=${LLM_CONNECT_TIMEOUT_SECONDS:-60}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-180}
    depends_on:
      - uitend-orchestrator-postgres
    networks:
      - uitend-orchestrator-network
      - thesis-network

  uitend-orchestrator-postgres:
    image: postgres:15
    container_name: uitend-orchestrator-postgresql
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - uitend-orchestrator-network

networks:
  uitend-orchestrator-network:
    driver: bridge

  thesis-network:
    external: true
    name: thesis-network

volumes:
  orchestrator_postgres_data:
